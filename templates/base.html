<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Workouts{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav>
    <span class="brand">Workouts</span>
    <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>Dashboard</a>
    <a href="{{ url_for('log_day') }}" {% if request.endpoint in ('log_day','log_session') %}class="active"{% endif %}>Log</a>
    <a href="{{ url_for('history') }}" {% if request.endpoint == 'history' %}class="active"{% endif %}>History</a>
    <a href="{{ url_for('weight') }}" {% if request.endpoint == 'weight' %}class="active"{% endif %}>Weight</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
